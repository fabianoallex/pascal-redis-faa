# Override que ADICIONA TLS (6380) ao servico do docker-compose.yml, sem altera-lo.
#
# 1) Gere a PKI de desenvolvimento (CA privada, servidor e cliente) em
#    docker/certs, a partir da raiz do repo:
#      sh tools/gen_certs.sh
#
# 2) Suba combinando os dois arquivos (a partir de docker/):
#      docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Mantem o listener plain (6379) e adiciona o TLS (6380), para o SmokeTest poder
# validar os dois caminhos contra o MESMO servidor -- inclusive o cenario de
# handshake TLS contra porta plain, que deve falhar com ERedisTimeout.
#
# tls-auth-clients "optional": cliente SEM certificado entra (e' o que a
# bateria inteira do SmokeTest --tls faz), e cliente COM certificado tem de
# apresentar um assinado pela CA, senao o handshake falha. E' o que deixa o
# mTLS (TlsCertFile/TlsKeyFile/TlsCertPassword, 0.4.0) ser exercitado na
# mesma porta.
#
# Certs sao de dev/descartaveis -- nao commite ./certs/.
services:
  redis:
    ports:
      - "6380:6380"   # RESP sobre TLS
    volumes:
      - ./certs:/certs:ro
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - optional
